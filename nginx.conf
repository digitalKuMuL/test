# ══════════════════════════════════════════════════════════════════
#  nginx.conf snippet — digitalkumul.com
#  Drop this into your server block (or include it from nginx.conf)
#  Full Stack Developer Portfolio — Papua New Guinea
# ══════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name digitalkumul.com www.digitalkumul.com;

    # ── Redirect HTTP → HTTPS ──
    return 301 https://digitalkumul.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.digitalkumul.com;

    # ── Redirect www → non-www ──
    return 301 https://digitalkumul.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name digitalkumul.com;

    # ── SSL certs (replace with your actual cert paths) ──
    ssl_certificate     /etc/letsencrypt/live/digitalkumul.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/digitalkumul.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Document root ──
    root  /var/www/digitalkumul.com/public;
    index index.html;

    # ── Charset ──
    charset utf-8;

    # ── Gzip ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml font/woff font/woff2;

    # ── Security headers ──
    add_header X-Frame-Options            "SAMEORIGIN"               always;
    add_header X-Content-Type-Options     "nosniff"                  always;
    add_header X-XSS-Protection           "1; mode=block"            always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://jangap411.github.io; connect-src 'self';" always;

    # ── Browser caching ──
    location ~* \.(css|js|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(jpg|jpeg|png|webp|svg|ico|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        expires 1h;
        add_header Cache-Control "public, no-cache";
    }
    location ~* \.(xml|txt|json|webmanifest)$ {
        expires 1d;
    }

    # ── Serve index.html for all routes (single-page portfolio) ──
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # ── Block hidden/sensitive files ──
    location ~ /\. {
        deny all;
    }

    # ── Custom 404 → index ──
    error_page 404 /index.html;

    # ── Hide server version ──
    server_tokens off;

    # ── Access & error logs ──
    access_log /var/log/nginx/digitalkumul_access.log;
    error_log  /var/log/nginx/digitalkumul_error.log;
}
